name: Publish image

on:
  push:
    # Releases: an image is published for each v* tag.
    tags: ["v*"]
  # Branches under review: every push to a PR publishes :dev, which the
  # test deployment follows.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # On a PR, tag the head commit rather than the merge commit.
  DOCKER_METADATA_PR_HEAD_SHA: "true"

# One :dev build at a time; a newer push supersedes the one in flight.
# Release builds each get their own group and are never cancelled.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'publish-dev' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish:
    # A fork's PR, or Dependabot's, gets a read-only token and cannot push
    # to the registry. This only spares those runs a failing build: a PR
    # can edit this condition, and what keeps it from publishing is the
    # token and secrets GitHub withholds from it.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The PR branch as pushed, not GitHub's merge of it into main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Tags are needed for `git describe` to name the build the way a
          # local build would.
          fetch-depth: 0

      - name: Describe the commit
        id: describe
        run: echo "commit=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # Builds share one cache in the registry. The gha cache is scoped per
      # branch, and branch builds can never read one another's. Registry
      # references must be lowercase; metadata-action does this for the
      # tags, but not for this one.
      - name: Name the build cache
        id: cache
        run: echo "ref=${IMAGE,,}:buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # A PR push or a manual run from any branch moves :dev, so a
            # test deployment can stay pinned to one tag while the build
            # under it changes.
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            THALIMAGE_COMMIT=${{ steps.describe.outputs.commit }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,image-manifest=true,oci-mediatypes=true

  # The test deployment follows :dev; tell it to pull the build just
  # published instead of waiting for Portainer's poll. Releases do not
  # move :dev, so they redeploy nothing.
  deploy:
    needs: publish
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deploy secrets live in this environment, not the repository, and
    # the OIDC token it gets names it (…:environment:test-deploy), which is
    # the subject the Tailscale trust credential accepts.
    environment: test-deploy
    permissions:
      contents: read
      id-token: write # the OIDC token Tailscale exchanges for an auth key
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      # Portainer's certificate is self-signed, hence --insecure; the
      # request travels inside the tailnet, which encrypts it.
      - name: Redeploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --insecure --max-time 120 -X POST "$DEPLOY_URL"
