name: Publish image

on:
  push:
    # Releases: an image is published for each v* tag.
    tags: ["v*"]
  # Branches under review: every push to a PR publishes :dev, which the
  # test deployment follows.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # On a PR, tag the head commit rather than the merge commit.
  DOCKER_METADATA_PR_HEAD_SHA: "true"

# One :dev build at a time; a newer push supersedes the one in flight.
# Release builds each get their own group and are never cancelled.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'publish-dev' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish:
    # A fork's PR gets a read-only token and cannot push to the registry.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR branch as pushed, not GitHub's merge of it into main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Tags are needed for `git describe` to name the build the way a
          # local build would.
          fetch-depth: 0

      - name: Describe the commit
        id: describe
        run: echo "commit=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # Builds share one cache in the registry. The gha cache is scoped per
      # branch, and branch builds can never read one another's. Registry
      # references must be lowercase; metadata-action does this for the
      # tags, but not for this one.
      - name: Name the build cache
        id: cache
        run: echo "ref=${IMAGE,,}:buildcache" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # A PR push or a manual run from any branch moves :dev, so a
            # test deployment can stay pinned to one tag while the build
            # under it changes.
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            THALIMAGE_COMMIT=${{ steps.describe.outputs.commit }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,image-manifest=true,oci-mediatypes=true
