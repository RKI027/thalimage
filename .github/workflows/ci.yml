name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.22"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The video tests (requires_ffmpeg) skip without it. A static build
      # (ffmpeg and ffprobe) installs in seconds, where apt takes ~17 s.
      # Pinned to a commit: the latest tag still runs on Node 20.
      - uses: federicocarboni/setup-ffmpeg@8073ccb51e517ed576e6871c7f2360c6de4ebb7c # main, 2026-06-01

      - run: make install
      - run: make fe-install

      # Lint, typecheck and tests for the backend, then svelte-check.
      - run: ./check.sh
