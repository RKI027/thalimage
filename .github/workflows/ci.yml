name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The video tests (requires_ffmpeg) skip without it. A static build
      # (ffmpeg and ffprobe) installs in seconds, where apt takes ~17 s.
      # BtbN's GitHub release first, johnvansickle.com if that fails; the
      # two archives lay out their binaries differently, hence the find.
      - name: Install ffmpeg
        run: |
          dest="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$dest/bin"
          for url in \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          do
            rm -rf "$dest/src" && mkdir -p "$dest/src"
            if curl -fsSL --retry 3 --connect-timeout 20 "$url" | tar -xJ -C "$dest/src" &&
               find "$dest/src" -type f \( -name ffmpeg -o -name ffprobe \) -exec mv {} "$dest/bin/" \; &&
               "$dest/bin/ffmpeg" -version >/dev/null && "$dest/bin/ffprobe" -version >/dev/null
            then
              break
            fi
            echo "::warning::ffmpeg download failed: $url"
          done
          if ! "$dest/bin/ffmpeg" -version | head -1; then
            echo "::error::Could not install ffmpeg"
            exit 1
          fi
          echo "$dest/bin" >> "$GITHUB_PATH"

      - run: make install
      - run: make fe-install

      # Lint, typecheck and tests for the backend, then svelte-check.
      - run: ./check.sh
