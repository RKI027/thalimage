name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.22"
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The video tests (requires_ffmpeg) skip without it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: make install
      - run: make fe-install

      # Lint, typecheck and tests for the backend, then svelte-check.
      - run: ./check.sh
