# Keeps the workflows' commit-pinned actions current; the version comment
# beside each pin is what Dependabot reads and rewrites.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # The 1st and 15th: roughly every two weeks
      interval: cron
      cronjob: "0 6 1,15 * *"
